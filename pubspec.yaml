name: ocr_workshop
description: DevFest Nairobi workshop demo - on-device OCR with Flutter and Google ML Kit.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

# Versions are left open on purpose: `flutter pub get` resolves the latest
# compatible ones. Commit the generated pubspec.lock so the repo is reproducible.
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: any
  equatable: any
  camera: any
  google_mlkit_text_recognition: any
  image: any # only used by the optional PREPROCESS experiment
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  bloc_test: any
  mocktail: any

flutter:
  uses-material-design: true
